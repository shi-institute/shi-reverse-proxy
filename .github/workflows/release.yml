name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Create release PR or publish to GitHub Packages
        uses: changesets/action@v1
        with:
          # When the version PR is merged, builds and publishes each package
          # to the GitHub Package Registry, then creates a GitHub release.
          publish: pnpm publish -r --no-git-checks
          version: pnpm changeset version
          commit: 'chore: release packages'
          title: 'chore: release packages'
